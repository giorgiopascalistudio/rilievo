name: Prova simulatore
on:
  workflow_dispatch:
  push:
    paths: ["ios/**"]
jobs:
  prova:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
      - run: brew install xcodegen
      - name: Compila per simulatore
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -project Rilievo.xcodeproj -target Rilievo -configuration Debug -sdk iphonesimulator \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO build > sim.log 2>&1 || {
              grep -E "error:" sim.log | sort -u | head -60; exit 1; }
      - name: Avvia, fotografa, cerca crash
        working-directory: ios
        run: |
          APP=build/Debug-iphonesimulator/Rilievo.app
          mkdir -p shots
          scegli() { xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if '$1' in x['name']))"; }
          for disp in "iPhone 17 Pro" "iPad Pro 13"; do
            U=$(scegli "$disp") || U=$(scegli "${disp%% *}")
            nome=$(echo "$disp" | tr ' ' '_')
            xcrun simctl boot "$U"; xcrun simctl bootstatus "$U" -b > /dev/null
            xcrun simctl install "$U" "$APP"
            for prova in elenco nuovo demo scheda; do
              xcrun simctl terminate "$U" com.giorgiopascali.rilievo 2>/dev/null || true
              xcrun simctl launch "$U" com.giorgiopascali.rilievo -prova $prova > /dev/null
              sleep 9
              xcrun simctl io "$U" screenshot "shots/${nome}_$prova.png" > /dev/null
              if ! xcrun simctl spawn "$U" launchctl list | grep -q rilievo; then echo "CRASH: $disp $prova" | tee -a shots/esito.txt; fi
            done
            xcrun simctl shutdown "$U"
          done
          cp ~/Library/Logs/DiagnosticReports/Rilievo* shots/ 2>/dev/null || true
          ls shots; cat shots/esito.txt 2>/dev/null || echo "nessun crash"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prove
          path: ios/shots
